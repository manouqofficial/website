<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANOUQ — Coming Soon</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #111111;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        .brand {
            font-size: clamp(32px, 6vw, 58px);
            font-weight: 700;
            letter-spacing: 0.22em;
            margin-left: 0.22em;
            margin-bottom: 35px;
        }

        .coming-soon {
            font-size: clamp(42px, 9vw, 90px);
            font-weight: 300;
            letter-spacing: 0.08em;
        }

        .line {
            width: 55px;
            height: 2px;
            background: #111111;
            margin: 28px auto 0;
        }

        @media (max-width: 600px) {
            .brand {
                margin-bottom: 25px;
            }

            .coming-soon {
                line-height: 1.1;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brand">MANOUQ</div>
        <div class="coming-soon">COMING SOON</div>
        <div class="line"></div>
    </main>
</body>
</html>
